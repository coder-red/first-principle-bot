<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Principle Bot</title>
  <meta name="description" content="Understand anything from the ground up — strict first principles explanations">
  <!-- Declared explicitly so the browser stops guessing at /favicon.ico. That
       guess 404s, and Chromium logs a 404 as a console error, which the browser
       suites count as a JS error — an intermittent failure depending on whether
       the request landed before the assertion. -->
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-inner">
        <h1 class="sr-only">First Principle Bot</h1>
        <div class="header-actions">
          <button id="new-thread" class="ghost-btn" hidden>New thread</button>
        </div>
      </div>
    </header>

    <main>
      <div id="messages" role="log" aria-live="polite" aria-label="Conversation">
        <div class="welcome">
          <h2>Ask me anything</h2>
          <p>I break it down to what is <strong>irreducibly true</strong>, then rebuild the answer from there. No analogies.</p>
          <div class="explore">
            <div class="explore-rail" id="sector-rail" role="tablist" aria-label="Explore by sector"></div>
            <div class="suggestions" id="suggestions" role="tabpanel" aria-live="polite"></div>
            <button type="button" id="shuffle-suggestions" class="shuffle-btn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
                <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>
              </svg>
              <span id="shuffle-label">Show me others</span>
            </button>
          </div>
        </div>
      </div>

      <div id="typing-indicator" class="typing-indicator hidden">
        <div class="typing-dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <span class="typing-label">Decomposing to first principles...</span>
      </div>

      <button id="scroll-bottom" aria-label="Scroll to bottom" title="Scroll to bottom">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </main>

    <footer>
      <form id="input-form" autocomplete="off">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            placeholder="Ask anything..."
            rows="1"
            autofocus
            aria-label="Your question"
          ></textarea>
          <button type="submit" id="send-btn" aria-label="Send question" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="footer-note">Enter to send &middot; Shift+Enter for a new line</p>
      </form>
    </footer>
  </div>

  <div id="error-toast" class="toast hidden" role="alert">
    <div class="toast-content">
      <span class="toast-icon" aria-hidden="true">!</span>
      <span id="toast-message">Something went wrong</span>
    </div>
    <button class="toast-close" aria-label="Dismiss">&times;</button>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
