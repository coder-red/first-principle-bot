# First Principle Bot — nginx reverse proxy.
#
#   Ubuntu:       /etc/nginx/sites-available/fpb  (symlink into sites-enabled)
#   Oracle Linux: /etc/nginx/conf.d/fpb.conf
#
# Replace every `fpb.example.com` below with your domain, then run certbot —
# see deploy/oci/README.md. The limit_* zones must sit in the http{} context,
# which both paths above already are.

limit_req_zone  $binary_remote_addr zone=fpb_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=fpb_conn:10m;

upstream fpb {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen      80;
    listen [::]:80;
    server_name fpb.example.com;

    # Certbot writes its challenge here and needs port 80 reachable to renew,
    # so this block stays after TLS is set up.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the newer `http2 on;` directive, which is
    # nginx 1.25+ only and a hard error on the 1.24 that Ubuntu 24.04 ships.
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fpb.example.com;

    # certbot --nginx fills these in. Left here so the file is complete.
    ssl_certificate     /etc/letsencrypt/live/fpb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fpb.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Request size ─────────────────────────────────────────────────────
    # ChatRequest permits 60 history messages of 20 000 characters each, so a
    # valid body can reach ~1.2 MB, and build_messages forwards the last 20 of
    # them to the model — roughly 100 000 tokens billed on a request the caller
    # fully controls. Real sessions are a few kilobytes. This caps the
    # amplification without touching the schema; raise it if a genuine long
    # thread ever 413s.
    client_max_body_size 256k;

    # ── Security headers ─────────────────────────────────────────────────
    # The app sets none of its own. Note that nginx `add_header` REPLACES
    # rather than merges when a location declares its own, so these are kept at
    # server level and no location below adds any.
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "DENY"                      always;
    add_header Referrer-Policy           "no-referrer"               always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tight because the frontend has no inline script and no inline style: every
    # node is built in script.js and every rule lives in style.css. The only
    # third party is Google Fonts (a stylesheet from googleapis, the font files
    # from gstatic), and `data:` covers the one inline SVG background in the
    # CSS. If you ever self-host the fonts, drop both font domains.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # ── Proxy defaults, inherited by every location below ────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection "";          # required for upstream keepalive
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # ══════════════════════════════════════════════════════════════════════
    # THE LOAD-BEARING LINE. Do not change $remote_addr to
    # $proxy_add_x_forwarded_for.
    #
    # fpb/limits.py keys every rate limiter on the FIRST entry of this header.
    # $proxy_add_x_forwarded_for appends the real peer to whatever the client
    # sent, so a caller passing `X-Forwarded-For: 1.2.3.4` would produce
    # "1.2.3.4, <real ip>" and the app would bucket them as 1.2.3.4 — a fresh
    # bucket on every request, defeating all three limiters including the one
    # in front of the access-token exchange.
    #
    # Overwriting it here is what makes the per-IP limits mean anything.
    # ══════════════════════════════════════════════════════════════════════
    proxy_set_header   X-Forwarded-For   $remote_addr;

    # ── Streaming ────────────────────────────────────────────────────────
    # /api/chat/stream emits NDJSON for 25-35s. Buffering would hold the whole
    # response and hand it over in one piece, which defeats the endpoint — the
    # app already sends X-Accel-Buffering: no, and this is the belt to that
    # brace. The read timeout must clear DECK_TIMEOUT_SECONDS (default 90).
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://fpb;
    }

    # Only the API is metered here. Defence in depth behind the app's own
    # per-IP limits, which are the real ones — this just keeps a flood from
    # reaching Python at all. burst covers the handful of calls a single page
    # load makes; limit_conn bounds concurrent 30s streams per caller.
    location /api/ {
        limit_req  zone=fpb_api burst=20 nodelay;
        limit_conn fpb_conn 8;
        proxy_pass http://fpb;
    }

    # Deliberately NOT cached and NOT served straight off disk by nginx. The
    # frontend has no build step and no content hashing, so any cache lifetime
    # longer than a deploy leaves visitors on a stale script.js against a new
    # API. Serve them from nginx once assets are fingerprinted, not before.
}
