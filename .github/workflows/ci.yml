name: CI

# Tests only. Nothing here deploys — Render builds from its own blueprint.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README promises; 3.13 catches deprecations early.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/ -q

  browser:
    name: browser suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Install chromium
        run: python -m playwright install --with-deps chromium

      # No API key: every suite stubs /api/chat and uses /api/sample-deck. The
      # reloader would fork a second process the teardown never sees.
      - name: Start the server
        run: |
          RELOAD=0 python main.py &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "server never came up"
          exit 1

      - run: python tests/browser/run_all.py

      # Screenshots are gitignored, but several bugs here were found by looking
      # at them rather than by an assertion — so keep them off a failed run.
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: tests/browser/_shots/
          if-no-files-found: ignore

      - name: Stop the server
        if: always()
        run: kill "$SERVER_PID" || true
